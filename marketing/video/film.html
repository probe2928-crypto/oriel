<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:FG;src:url(fg.woff2) format("woff2");font-weight:100 900}
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#E9D3C2}
body{font-family:FG,"Noto Sans CJK KR",sans-serif;color:#171513;word-break:keep-all;-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0;opacity:0}
.bg{position:absolute;inset:-4%;background-size:cover;background-position:center}
.img{position:absolute;inset:0;background-size:cover;background-position:center 55%}
.wm{display:block;fill:#171513}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.small{font-weight:500;letter-spacing:.28em;text-transform:uppercase}
.ko{font-family:"Noto Sans CJK KR",sans-serif;font-weight:500}
.cap{position:absolute;left:var(--pad);right:var(--pad);bottom:var(--pad);display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.cap .no{font-weight:800;letter-spacing:-.05em;line-height:.85}
.cap .t{font-weight:700;letter-spacing:-.03em;line-height:1}
.cap .k{margin-top:.5em;opacity:.8}
.rule{height:2px;background:#171513;margin-bottom:18px;transform-origin:left}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.sweep{position:absolute;inset:-20%;mix-blend-mode:soft-light;background:radial-gradient(closest-side,rgba(255,244,230,.9),rgba(255,244,230,0));width:80%;height:80%}
.land .img{inset:auto;top:7%;bottom:7%;right:9%;aspect-ratio:4/5;box-shadow:0 30px 80px rgba(120,80,50,.18)}
.land .cap{right:auto;width:36%;bottom:auto;top:50%;transform:translateY(-50%);flex-direction:column;align-items:flex-start}
.land .cap>div{text-align:left!important;width:100%}
.ibg{position:absolute;inset:0}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 220px rgba(120,80,50,.18)}
</style></head><body>
<div id="L1" class="layer"><div class="bg" id="bg1"></div><div class="center"><div id="w1"></div><p class="small" id="s1"></p></div></div>
<div id="L2" class="layer"><div class="bg" id="bg2"></div><div class="center"><p id="q1"></p><p class="ko" id="q1k"></p></div></div>
<div id="L3" class="layer"><div class="img" id="i3"></div><div class="cap"><div style="flex:1"><div class="rule" id="r3"></div><div class="no">01</div></div><div style="text-align:right"><div class="t">Learn</div><div class="k ko">배움 · 교육</div></div></div></div>
<div id="L4" class="layer"><div class="img" id="i4"></div><div class="cap"><div style="flex:1"><div class="rule" id="r4"></div><div class="no">02</div></div><div style="text-align:right"><div class="t">Live</div><div class="k ko">삶 · 음식</div></div></div></div>
<div id="L5" class="layer"><div class="img" id="i5"></div><div class="cap"><div style="flex:1"><div class="rule" id="r5"></div><div class="no">03</div></div><div style="text-align:right"><div class="t">Build</div><div class="k ko">지음 · 주거</div></div></div></div>
<div id="L6" class="layer"><div class="bg" id="bg6"></div><div class="center"><p id="q2"></p><p id="q2s"></p><p class="ko" id="q2k"></p></div></div>
<div id="L7" class="layer"><div class="bg" id="bg7"></div><div class="center"><div id="w7"></div><p class="small" id="s7"></p><p id="u7"></p><p class="ko" id="k7"></p></div></div>
<div class="sweep" id="sw"></div><div class="vig"></div><div class="grain"></div>
<script>
const P=new URLSearchParams(location.search), W=innerWidth, H=innerHeight, V=H>W, u=Math.min(W,H)/1080;
if(!V)document.body.classList.add('land');
document.documentElement.style.setProperty('--pad',(V?84:96)*u+'px');
const $=id=>document.getElementById(id);
const WIN=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 1000' preserveAspectRatio='xMidYMid slice' style='width:100%;height:100%;display:block'><defs><filter id='b' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='14'/></filter><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#EED6C5'/><stop offset='1' stop-color='#DFC0AA'/></linearGradient><linearGradient id='l' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#FBEBDD' stop-opacity='.95'/><stop offset='1' stop-color='#F6E0CE' stop-opacity='.55'/></linearGradient></defs><rect width='1000' height='1000' fill='url(#g)'/><g filter='url(#b)' transform='translate(560 170) skewX(-24) rotate(6)'><path d='M0 260 A170 170 0 0 1 340 260 L340 900 L0 900 Z' fill='url(#l)'/><rect x='160' y='80' width='22' height='840' fill='#E6C8B3'/><rect x='-10' y='430' width='360' height='22' fill='#E6C8B3'/></g></svg>`;
['bg1','bg2','bg6','bg7'].forEach(i=>$(i).innerHTML=WIN);
if(!V)['L3','L4','L5'].forEach(id=>{const d=document.createElement('div');d.className='ibg';d.innerHTML=WIN;$(id).prepend(d);});
$('i3').style.backgroundImage='url(oriel-still-edu.png)';$('i4').style.backgroundImage='url(oriel-still-food.png)';$('i5').style.backgroundImage='url(oriel-still-home.png)';
fetch('wm.svg').then(r=>r.text()).then(s=>{for(const id of ['w1','w7']){$(id).innerHTML=s;const g=$(id).firstElementChild;g.classList.add('wm');g.style.width=(id=='w1'?(V?720:820):(V?560:620))*u+'px';g.style.height='auto';}window.ready=true});
const fs=(el,px,w)=>{el.style.fontSize=px*u+'px';if(w)el.style.fontWeight=w};
fs($('s1'),26);$('s1').style.marginTop=48*u+'px';$('s1').innerHTML='Oriel Foundation &nbsp;·&nbsp; 明窗基金會';
$('q1').innerHTML=V?'A small window<br>lets light into<br>a room.':'A small window lets light<br>into a room.';fs($('q1'),V?96:92,700);$('q1').style.letterSpacing='-.035em';$('q1').style.lineHeight='1.04';
$('q1k').textContent='작은 창 하나가 방 안에 빛을 들입니다.';fs($('q1k'),34);$('q1k').style.marginTop=44*u+'px';
document.querySelectorAll('.cap .no').forEach(e=>fs(e,V?190:170));document.querySelectorAll('.cap .t').forEach(e=>fs(e,V?92:84));document.querySelectorAll('.cap .k').forEach(e=>fs(e,32));
$('q2').textContent='Love first.';fs($('q2'),V?132:128,800);$('q2').style.letterSpacing='-.05em';
$('q2s').innerHTML='“We love him, because he first loved us.”<br><span style="opacity:.7">1 John 4:19</span>';fs($('q2s'),34);$('q2s').style.marginTop=40*u+'px';$('q2s').style.lineHeight='1.5';
$('q2k').textContent='우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라 · 요한일서 4:19';fs($('q2k'),26);$('q2k').style.marginTop=26*u+'px';$('q2k').style.opacity=.75;$('q2k').style.maxWidth=(V?820:1200)*u+'px';
fs($('s7'),24);$('s7').style.marginTop=44*u+'px';$('s7').innerHTML='Learn &nbsp;·&nbsp; Live &nbsp;·&nbsp; Build';
$('u7').textContent='orielfoundation.org';fs($('u7'),40,600);$('u7').style.marginTop=64*u+'px';$('u7').style.letterSpacing='-.01em';
$('k7').textContent='이번 겨울, 필리핀 봉사에 함께해 주세요';fs($('k7'),28);$('k7').style.marginTop=18*u+'px';$('k7').style.opacity=.75;
const cl=x=>Math.max(0,Math.min(1,x)), e=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const win=(t,a,b,fi=.7,fo=.7)=>Math.min(e(cl((t-a)/fi)),e(cl((b-t)/fo)));
const S=[['L1',0,3.7,.01,.8],['L2',3.3,6.9],['L3',6.5,10.9],['L4',10.5,14.9],['L5',14.5,18.9],['L6',18.5,22.4],['L7',22.0,27,.9,.01]];
window.DUR=27;
window.render=t=>{
 for(const [id,a,b,fi,fo] of S){const o=win(t,a,b,fi??.8,fo??.8);$(id).style.opacity=o;$(id).style.visibility=o>0?'visible':'hidden';}
 const p=(a,b)=>cl((t-a)/(b-a));
 // intro logo
 let k=e(p(.2,2.0)); $('w1').style.opacity=k; $('w1').style.filter=`blur(${(1-k)*14*u}px)`; $('w1').style.transform=`scale(${1.06-.06*k})`;
 $('s1').style.opacity=e(p(1.3,2.4)); $('s1').style.transform=`translateY(${(1-e(p(1.3,2.4)))*14*u}px)`;
 $('bg1').style.transform=`scale(${1.0+.04*p(0,3.7)})`;
 $('bg2').style.transform=`scale(${1.04-.04*p(3.3,6.9)})`; $('q1').style.transform=`translateY(${(1-e(p(3.5,4.6)))*24*u}px)`; $('q1k').style.opacity=e(p(4.3,5.2));
 [['i3','r3',6.5,10.9],['i4','r4',10.5,14.9],['i5','r5',14.5,18.9]].forEach(([i,r,a,b],n)=>{const q=p(a,b);if(V){$(i).style.transform=`scale(${1.10-.08*e(q)}) translate(${(n%2?-1:1)*(q-.5)*14*u}px,0)`;}else{$(i).style.backgroundSize=`${(112-10*e(q))}%`;$(i).style.transform=`translateY(${(1-e(cl((t-a)/1.2)))*30*u}px)`;}$(r).style.transform=`scaleX(${e(p(a+.5,a+1.8))})`;});
 $('bg6').style.transform=`scale(${1.0+.03*p(18.5,22.4)})`; $('q2').style.transform=`translateY(${(1-e(p(18.7,19.8)))*24*u}px)`; $('q2s').style.opacity=e(p(19.4,20.4)); $('q2k').style.opacity=.75*e(p(19.9,20.8));
 k=e(p(22.2,24.0)); $('w7').style.opacity=k; $('w7').style.filter=`blur(${(1-k)*12*u}px)`; $('w7').style.transform=`scale(${1.05-.05*k})`;
 $('s7').style.opacity=e(p(23.2,24.2)); $('u7').style.opacity=e(p(23.8,24.8)); $('k7').style.opacity=.75*e(p(24.3,25.2));
 $('bg7').style.transform=`scale(${1.04-.04*p(22,27)})`;
 const sx=-30+130*(t/27); $('sw').style.left=sx+'%'; $('sw').style.top=(V?10:-10)+'%'; $('sw').style.opacity=.55;
};
</script></body></html>
